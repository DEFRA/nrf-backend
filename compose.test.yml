services:
  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4567:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack-test:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: nrf_backend
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      retries: 5
      start_period: 1s
      timeout: 10s
    networks:
      - cdp-tenant

  liquibase:
    image: liquibase/liquibase:4.27.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./changelog:/liquibase/changelog
    command: --url=jdbc:postgresql://postgres:5432/nrf_backend --username=postgres --password=password --changelog-file=changelog/db.changelog.xml update
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6381:6379'
    restart: always
    networks:
      - cdp-tenant

  cdp-uploader:
    # Pinned: the moving `latest` tag silently broke these integration tests when
    # cdp-uploader 1.17.0/1.18.0 shipped (2026-07-14) — 1.18.0 rejects the relative
    # `redirect` we send ("Failed to convert path to absolute url") and marks uploads
    # as errored. 1.16.0 is the last known-good. Override with CDP_UPLOADER_VERSION.
    # Follow-up ticket: make the backend compatible with >= 1.17.0 and unpin.
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-1.16.0}
    ports:
      - '7338:7337'
    links:
      - 'localstack:localstack'
      - 'redis:redis'
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 7337
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      MOCK_VIRUS_SCAN_ENABLED: true
      MOCK_VIRUS_RESULT_DELAY: 3
      SQS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      CONSUMER_BUCKETS: ${CDP_UPLOADER_BUCKET:-boundaries}
    networks:
      - cdp-tenant

  sscl-sftp:
    # Local stand-in for SSCL's MOVEit SFTP server. Keys are throwaway, generated
    # by the vitest global setup into .sftp-test-keys (gitignored). Every checkout
    # shares this container, so don't run the tests from two checkouts at once.
    image: atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
    platform: linux/amd64
    ports:
      - '127.0.0.1:2223:22'
    command: CDDEFTNRLOut::::Interfaces/DEF/Test/NRLOut,Interfaces/DEF/RouteTest/NRLOut CDDEFTNRLIn::::Interfaces/DEF/Test/NRLIn,Interfaces/DEF/RouteTest/NRLIn
    volumes:
      - ./.sftp-test-keys/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:ro
      - ./.sftp-test-keys/client.pub:/home/CDDEFTNRLOut/.ssh/keys/client.pub:ro
      - ./.sftp-test-keys/client.pub:/home/CDDEFTNRLIn/.ssh/keys/client.pub:ro
    healthcheck:
      # Looks for the listening port, not the process: sshd rewrites its process
      # title, so `pgrep -x sshd` fails on a native amd64 host such as CI
      test: ['CMD-SHELL', "netstat -ltn | grep -q ':22 '"]
      interval: 2s
      start_period: 5s
      retries: 30
    networks:
      - cdp-tenant

volumes:
  postgres-test-data:

networks:
  cdp-tenant:
    driver: bridge
