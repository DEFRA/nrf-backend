services:
  localstack:
    image: localstack/localstack:3.0.2
    ports:
      - '4567:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN
      SERVICES: s3,sqs,sns,firehose
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack-test:/var/lib/localstack'
      - ./compose/start-localstack.sh:/etc/localstack/init/ready.d/start-localstack.sh
    healthcheck:
      test: ['CMD', 'curl', 'localhost:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
      POSTGRES_DB: nrf_backend
    ports:
      - '5433:5432'
    volumes:
      - postgres-test-data:/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      retries: 5
      start_period: 1s
      timeout: 10s
    networks:
      - cdp-tenant

  liquibase:
    image: liquibase/liquibase:4.27.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./changelog:/liquibase/changelog
    command: --url=jdbc:postgresql://postgres:5432/nrf_backend --username=postgres --password=password --changelog-file=changelog/db.changelog.xml update
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6381:6379'
    restart: always
    networks:
      - cdp-tenant

  cdp-uploader:
    # Pinned: the moving `latest` tag silently broke these integration tests when
    # cdp-uploader 1.17.0/1.18.0 shipped (2026-07-14) — 1.18.0 rejects the relative
    # `redirect` we send ("Failed to convert path to absolute url") and marks uploads
    # as errored. 1.16.0 is the last known-good. Override with CDP_UPLOADER_VERSION.
    # Follow-up ticket: make the backend compatible with >= 1.17.0 and unpin.
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-1.16.0}
    ports:
      - '7338:7337'
    links:
      - 'localstack:localstack'
      - 'redis:redis'
    depends_on:
      localstack:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 7337
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      MOCK_VIRUS_SCAN_ENABLED: true
      MOCK_VIRUS_RESULT_DELAY: 3
      SQS_ENDPOINT: http://localstack:4566
      S3_ENDPOINT: http://localstack:4566
      CONSUMER_BUCKETS: ${CDP_UPLOADER_BUCKET:-boundaries}
    networks:
      - cdp-tenant

volumes:
  postgres-test-data:

networks:
  cdp-tenant:
    driver: bridge
